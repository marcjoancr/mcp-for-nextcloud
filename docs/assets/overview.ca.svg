<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img" aria-labelledby="title description">
  <title id="title">El teu Nextcloud, a la conversa</title>
  <desc id="description">Un client MCP es connecta per HTTPS amb OAuth o una contrasenya d’aplicació. Nextcloud MCP comprova els permisos de l’usuari i ofereix Files, Notes, Calendar, Contacts, Tasks, Deck, Talk, People, Mail, Forms i els registres del servidor. Només es retornen al client els resultats permesos. Les escriptures requereixen un pla i confirmació.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b172c"/>
      <stop offset="1" stop-color="#132944"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#73c7ff" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1160" height="430" rx="20" fill="url(#background)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="38" fill="#83d1ff" font-size="12" font-weight="700" letter-spacing="2">APLICACIÓ NATIVA DE NEXTCLOUD</text>
    <text x="32" y="76" fill="#fff" font-size="29" font-weight="700">Una connexió. El teu Nextcloud.</text>
    <text x="32" y="104" fill="#bacce1" font-size="15">Porta la feina a la conversa, amb els permisos del teu compte.</text>

    <rect x="32" y="136" width="252" height="220" rx="14" fill="#172e49" stroke="#35516d"/>
    <rect x="50" y="155" width="38" height="32" rx="8" fill="#285578"/>
    <path d="M60 164h18v11H68l-5 5v-5h-3z" fill="none" stroke="#a3ddff" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="50" y="220" fill="#fff" font-size="22" font-weight="700">El teu client MCP</text>
    <text x="50" y="250" fill="#d3e1ef" font-size="15">Pregunta en llenguatge natural.</text>
    <text x="50" y="280" fill="#bacce1" font-size="14">Cerca fitxers. Prepara reunions.</text>
    <text x="50" y="302" fill="#bacce1" font-size="14">Posa’t al dia. Revisa un canvi.</text>
    <text x="50" y="334" fill="#83d1ff" font-size="10" font-weight="700">OAUTH O CONTRASENYA D’APLICACIÓ</text>

    <path d="M294 236h42" stroke="#73c7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="296" y="220" fill="#bacce1" font-size="10">HTTPS</text>

    <rect x="348" y="136" width="306" height="220" rx="14" fill="#073f69" stroke="#439ee0"/>
    <g transform="translate(366 153) scale(.95)" fill="none" stroke="#a3ddff" stroke-width="2.5" stroke-linecap="round">
      <path d="M16 16 7 8m9 8 9-8m-9 8v10"/>
      <g fill="#a3ddff" stroke="none"><circle cx="16" cy="16" r="4.5"/><circle cx="6.5" cy="7.5" r="3.5"/><circle cx="25.5" cy="7.5" r="3.5"/><circle cx="16" cy="26.5" r="3.5"/></g>
    </g>
    <text x="368" y="220" fill="#fff" font-size="22" font-weight="700">Nextcloud MCP</text>
    <text x="368" y="250" fill="#d3e1ef" font-size="15">La teva identitat. Els teus permisos.</text>
    <text x="368" y="280" fill="#bacce1" font-size="14">Accés natiu + restriccions de recursos</text>
    <text x="368" y="302" fill="#bacce1" font-size="14">+ etiquetes d’exclusió de fitxers</text>
    <text x="368" y="334" fill="#a3ddff" font-size="12" font-weight="700">Llegir · Planificar · Confirmar · Aplicar</text>

    <path d="M664 236h42" stroke="#73c7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <rect x="718" y="136" width="410" height="220" rx="14" fill="#172e49" stroke="#35516d"/>
    <text x="738" y="173" fill="#fff" font-size="22" font-weight="700">Les teves apps de Nextcloud</text>
    <text x="738" y="199" fill="#bacce1" font-size="14">Les apps i els permisos defineixen les eines.</text>
    <g fill="#223f5d">
      <rect x="738" y="217" width="112" height="32" rx="7"/><rect x="860" y="217" width="112" height="32" rx="7"/><rect x="982" y="217" width="126" height="32" rx="7"/>
      <rect x="738" y="259" width="112" height="32" rx="7"/><rect x="860" y="259" width="112" height="32" rx="7"/><rect x="982" y="259" width="126" height="32" rx="7"/>
      <rect x="738" y="301" width="66" height="32" rx="7"/><rect x="814" y="301" width="66" height="32" rx="7"/><rect x="890" y="301" width="66" height="32" rx="7"/><rect x="966" y="301" width="66" height="32" rx="7"/><rect x="1042" y="301" width="66" height="32" rx="7"/>
    </g>
    <g fill="#e1edf8" font-size="14" text-anchor="middle">
      <text x="794" y="238">Files</text><text x="916" y="238">Notes</text><text x="1045" y="238">Calendar</text>
      <text x="794" y="280">Contacts</text><text x="916" y="280">Tasks</text><text x="1045" y="280">Deck</text>
      <text x="771" y="322">Talk</text><text x="847" y="322">People</text><text x="923" y="322">Mail</text><text x="999" y="322">Forms</text><text x="1075" y="322">Registres</text>
    </g>
    <path d="M32 379h1096" stroke="#35516d"/>
    <text x="32" y="407" fill="#bacce1" font-size="14">Només es retornen al client els resultats permesos. Les escriptures requereixen previsualització i confirmació explícita.</text>
  </g>
</svg>
